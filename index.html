const SEC=['LP','UP','HS','HSS'],LV={school:'School Level',sub:'Sub District Level',dist:'District Level'};
let S={cfg:{name:'Kalotsavam-'+new Date().getFullYear(),level:'school',place:'',logo:'',base:{LP:100,UP:200,HS:300,HSS:400}},items:[],parts:[],res:{},jr:{},acc:[],sel:{}};
try{const x=localStorage.getItem('kh1');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
if(S.cfg&&S.cfg.name){const Y=String(new Date().getFullYear());S.cfg.name=S.cfg.name.replace('സ്കൂൾ കലോത്സവം 2026','Kalotsavam-2026').replace('സ്കൂൾ Kalotsavam-2026','Kalotsavam-2026').replace(/(?<!\d)20\d\d(?!\d|-\d\d)/g,Y)}
// ===== Google Sheets backend (Apps Script web app). Public read; PIN only for saving =====
const GS_URL='https://script.google.com/macros/s/AKfycbzUstlP97YRSC2qbRPco4WKjB6s_FowbPv4DTC8h13r5Sl_ztaVWV2hIBf-uN4Zv_vybA/exec';
function gsAskPin(){let p=sessionStorage.getItem('khpin')||'';if(!p){p=prompt('സേവ് ചെയ്യാൻ അഡ്മിൻ PIN നൽകുക (വായിക്കാൻ മാത്രമാണെങ്കിൽ Cancel അമർത്തുക)')||'';if(p)sessionStorage.setItem('khpin',p)}return p}
async function gsAll(){const p=sessionStorage.getItem('khpin')||'';const r=await fetch(GS_URL+'?pin='+encodeURIComponent(p)+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);return r.json()}
function gsAdapter(){
  const doc=path=>({
    get:async()=>{const all=await gsAll(),body=all[path];return{exists:body!==undefined,data:()=>body}},
    set:async body=>{
      const pin=gsAskPin();if(!pin)throw new Error('read-only');
      const r=await fetch(GS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pin,path,body})});
      const t=await r.text();
      if(t!=='ok'){sessionStorage.removeItem('khpin');throw new Error(t)}
    },
    onSnapshot:(cb,err)=>{
      let last=null,stop=false;
      const tick=async()=>{if(stop)return;try{const m=(await gsAll())['kh/meta'];const v=m&&m.v;if(v!==last){last=v;cb({exists:!!m,data:()=>m})}}catch(e){err&&err(e)}};
      tick();const id=setInterval(tick,12000);
      return()=>{stop=true;clearInterval(id)};
    }
  });
  return{doc};
}

// ===== Public results (pub/...) for the blog: only what the blog shows, no names or admission numbers =====
function pubBuild(){
  const Vn={};
  lvVenues().forEach(v=>{Vn[v]={};lvDates(v).forEach(d=>{
    let last=null;
    const its=lvItemsAt(v,d);
    const items=its.map(i=>{
      const r=lvR(i,d),dl=lvDelay(i,d);if(dl!=null)last=dl;
      const ps=parts(i).slice().sort((a,b)=>(+a.code||0)-(+b.code||0));
      return{id:i.id,name:i.name,sec:i.sec,group:!!i.group,time:i.time||'',start:r.start||'',end:r.end||'',
        delay:dl,status:lvSt(i,d),codes:lvCodes(i),count:ps.length,
        rows:ps.map(p=>{const x=lvRes(i,p);return{code:p.code||'',lot:S.lot[p.id]||'',pos:x.pos||0,g:x.g||'',pts:(x.pos||x.g)?PT(i,x):''}})};
    });
    const cur=items.find(x=>x.status=='ongoing'),nx=items.find(x=>x.status=='pending');
    Vn[v][d]={items,cur:cur?cur.id:'',next:nx?nx.id:'',last:last};
  })});
  return{venues:Vn,list:lvVenues(),vno:S.vnum||{},at:new Date().toISOString()};
}
async function khPubWrite(){
  const json=JSON.stringify(pubBuild()),ch=[];
  for(let k=0;k<json.length;k+=40000)ch.push(json.slice(k,k+40000));
  for(let n=0;n<ch.length;n++)await KH.doc('pub/s'+n).set({d:ch[n]});
  await KH.doc('pub/meta').set({n:ch.length,v:String(Date.now())+'-'+khMyV});
}

function schLine(){const n=String(S.cfg.name||'').replace(/^\s*Kerala\s+School\s+Kalotsavam[\s\-–—,:]*/i,'').trim(),pl=String(S.cfg.place||'').trim();return [n,pl].filter(Boolean).map(esc).join(', ')}

const KEYS=Object.keys(DICT).sort((a,b)=>b.length-a.length);
let LANG='en';
function trs(t){if(LANG!='en'||!/[\u0D00-\u0D7F]/.test(t))return t;for(const k of KEYS)t=t.split(k).join(DICT[k]);return t}
const _al=window.alert;window.alert=m=>_al(trs(m));
function walk(n){if(n.nodeType==3){const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else{if(n.classList&&n.classList.contains('nt'))return;if(n.placeholder){const v=trs(n.placeholder);if(v!==n.placeholder)n.placeholder=v}n.childNodes.forEach(walk)}}
let busy=false;

  const expStart=(nx&&last!=null&&mins(nx.time)!=null)?' | പ്രതീക്ഷിത ആരംഭം: '+hm(mins(nx.time)+last)+' ('+lvDel(last)+')':'';
  const sum=`<p><b>വേദി:</b> ${esc(v)} | <b>തീയതി:</b> ${fdt(d)} | ഇനങ്ങൾ: ${its.length} | പൂർത്തിയായത്: ${done}</p>`+
    `<p><b>ഇപ്പോൾ:</b> ${cur?ntx(cur.name)+' ('+esc(cur.sec)+')':'–'} | <b>അടുത്തത്:</b> ${nx?ntx(nx.name)+' (സമയം '+esc(nx.time||'–')+')':'–'}${expStart}</p>`;
  const rows=its.map((i,n)=>{
    const r=lvR(i,d),st=lvSt(i,d),dl=lvDelay(i,d);
    const inp=(f,val)=>pr?esc(val||''):`<input type="time" value="${esc(val||'')}" onchange="lvSet('${i.id}','${d}','${f}',this.value)"> <button class="b g" onclick="lvSet('${i.id}','${d}','${f}',nowT())">Now</button>`;
    const dtxt=dl==null?'–':(dl>0?'<b style="color:#a00">'+lvDel(dl)+'</b>':lvDel(dl));
    return `<tr style="${st=='ongoing'?'background:#fff3c4':''}"><td>${n+1}</td><td>${lvCodes(i)}</td><td>${ntx(i.name)}${i.group?' 👥':''}</td><td>${esc(i.sec)}</td><td>${esc(i.time||'')}</td><td style="white-space:nowrap">${inp('start',r.start)}</td><td style="white-space:nowrap">${inp('end',r.end)}</td><td>${dtxt}</td><td>${parts(i).length}</td><td>${LVST[st]}</td></tr>`;
  }).join('');
  const sel=its.filter(i=>S.sel.lvall||i.id==S.sel.li);
  const blk=(i,n)=>{
    const ps=parts(i).slice().sort((a,b)=>(+a.code||0)-(+b.code||0));
    const trs=ps.map(p=>{
      const x=lvRes(i,p),has=x.pos||x.g;
      const lot=pr?esc(S.lot[p.id]||''):`<input style="width:70px" value="${esc(S.lot[p.id]||'')}" onchange="S.lot['${p.id}']=this.value;sv()">`;
      return `<tr><td>${esc(p.code||'')}</td><td>${ntx(p.name)}</td><td>${ntx(p.school||'')}</td><td>${esc(p.std||'')} ${esc(p.div||'')}</td><td>${lot}</td><td>${x.pos?(['','1st','2nd','3rd'][x.pos]||esc(x.pos)):''}</td><td><b>${esc(x.g||'')}</b></td><td>${has?PT(i,x):''}</td></tr>`;
    }).join('');
    return `<div class="${n?'pg':''}"><h4>${ntx(i.name)} (${esc(i.sec)}) – ${esc(i.time||'')} – Code ${lvCodes(i)} – മത്സരാർത്ഥികൾ/ടീമുകൾ: ${ps.length}</h4><table><tr><th>Code</th><th>Name</th><th>School</th><th>Class / Div</th><th>Lot No.</th><th>Position</th><th>Grade</th><th>Points</th></tr>${trs||'<tr><td colspan="8"><i>No participants</i></td></tr>'}</table></div>`;
  };
  return hdr('Venue Live – '+esc(v),fdt(d))+sum+
    `<table><tr><th>Sl</th><th>Code</th><th>Item</th><th>Sec</th><th>Scheduled</th><th>Start</th><th>End</th><th>Delay</th><th>Participants</th><th>Status</th></tr>${rows||'<tr><td colspan="10"><i>No items</i></td></tr>'}</table>`+
    `<div style="margin-top:12px">${sel.map((i,n)=>blk(i,n)).join('')}</div>`;
}

// ===== Online shared storage (Artifact db). Whole state is saved in chunks under kh/s0.. and kh/meta =====
function setSync(t){const e=$('khs');if(e)e.textContent=t}
async function khLoad(meta){
  let json='';
  for(let n=0;n<(+meta.n||0);n++){const c=await KH.doc('kh/s'+n).get();json+=((c.data()||{}).d)||''}
  if(!json)return;
  S=Object.assign(S,JSON.parse(json));S.ev=S.ev||{};S.lot=S.lot||{};
  try{localStorage.setItem('kh1',json)}catch(e){}
}
function khPush(){khQ=khQ.then(async()=>{
  if(!KH)return;
  await mergeRuns();
  const json=JSON.stringify(S),ch=[];
  for(let k=0;k<json.length;k+=40000)ch.push(json.slice(k,k+40000));
  const v=Date.now()+'-'+Math.random().toString(36).slice(2,8);
  try{
    for(let n=0;n<ch.length;n++)await KH.doc('kh/s'+n).set({d:ch[n]});
    await KH.doc('kh/meta').set({n:ch.length,v});
    khMyV=v;await KH.doc('pub/live').set({d:JSON.stringify(liveBuild())});setSync('✓ ഓൺലൈനിൽ സേവ് ചെയ്തു '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('⚠ സേവ് ആയില്ല: '+friendlyErr(e))}
})}
async function khBoot(){
  setSync('ഡാറ്റ ലോഡ് ചെയ്യുന്നു…');
  gsAskPin();KH=gsAdapter();
  if(!KH){setSync('ഓഫ്‌ലൈൻ: ഈ ബ്രൗസറിൽ മാത്രം സേവ് ആകുന്നു');go();return}
  try{
    const m=await KH.doc('kh/meta').get();
    if(m.exists){await khLoad(m.data());khMyV=m.data().v||'';await mergeRuns()}
    else if(S.items.length||S.parts.length){khPush()}
    KH.doc('kh/meta').onSnapshot(s=>{
      if(!s.exists||!s.data())return;const d=s.data();
      if(d.v===khMyV||khT)return;
      khMyV=d.v;
      khQ=khQ.then(()=>khLoad(d)).then(()=>{if(!khT){go();setSync('⟳ മറ്റൊരു ഉപകരണത്തിൽ നിന്നുള്ള മാറ്റം ലഭിച്ചു')}});
    },()=>setSync('⚠ തത്സമയ സമന്വയം നിലച്ചു – പേജ് റീലോഡ് ചെയ്യുക'));
    setSync('✓ ഓൺലൈൻ സമന്വയം ഓൺ');
  }catch(e){setSync('⚠ ഓൺലൈൻ ഡാറ്റ ലോഡ് ചെയ്യാനായില്ല')}
  go();
}

// ===== Venues: master list (number + name) and which item runs where, on which date and time =====
S.venues=S.venues||[];S.vnum=S.vnum||{};
function vAdd(){const n=($('vn').value||'').trim(),no=($('vno').value||'').trim();if(!n)return;if(!S.venues.includes(n))S.venues.push(n);if(no)S.vnum[n]=no;sv();go()}
function vDel(k){const n=S.venues[k];S.venues.splice(k,1);if(n)delete S.vnum[n];sv();go()}
function vNo(k,v){const n=lvVenues()[k];if(n){S.vnum[n]=(v||'').trim();sv()}}
function vdlHtml(){return '<datalist id="vdl">'+lvVenues().map(v=>'<option value="'+esc(v)+'">').join('')+'</datalist>'}
function vAssign(){
  const v=($('avn').value||'').trim(),id=$('ait').value,d=$('ad').value,t=$('at').value;
  const i=it(id);
  if(!v){alert('വേദി തിരഞ്ഞെടുക്കുക');return}
  if(!i){alert('ഇനം തിരഞ്ഞെടുക്കുക');return}
  if(!d){alert('തീയതി നൽകുക');return}
  i.venue=v;
  const ds=dts(i);if(!ds.includes(d))ds.push(d);
  i.dates=ds.sort();i.date=i.dates[0];
  if(t)i.time=t;
  sv();go();
}
function vClearTime(id){const i=it(id);if(!i)return;i.time='';sv();go()}
function vRemoveDate(id,d){const i=it(id);if(!i)return;i.dates=dts(i).filter(x=>x!==d);i.date=i.dates[0]||'';if(!i.dates.length)i.venue='';sv();go()}
function vRows(){
  const out=[];
  S.items.forEach(i=>{if(!(i.venue||'').trim())return;const ds=dts(i);(ds.length?ds:['']).forEach(d=>out.push({i,d}))});
  return out.sort((a,b)=>(a.i.venue||'').trim().localeCompare((b.i.venue||'').trim())||a.d.localeCompare(b.d)||(a.i.time||'').localeCompare(b.i.time||''));
}

<div class="card"><b>വേദിയിൽ ഇനം, തീയതി, സമയം ചേർക്കുക</b><p style="color:var(--mu);font-size:13px;margin:6px 0">ഒരു ഇനം ഒരു വേദിയിലേ ഉണ്ടാകൂ. പുതിയ വേദി തിരഞ്ഞെടുത്താൽ ഇനം അവിടേക്ക് മാറും. ഒരേ ഇനത്തിന് ഒന്നിലധികം തീയതികൾ ചേർക്കാം.</p>
<div class="row">
<div><label>വേദി</label><select id="avn">${all.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')||'<option value="">— വേദി ചേർക്കുക —</option>'}</select></div>
<div><label>ഇനം</label><select id="ait">${S.items.map(i=>`<option value="${i.id}">${esc(i.name)} (${esc(i.sec)})${(i.venue||'').trim()?' – നിലവിൽ: '+esc(i.venue.trim()):''}</option>`).join('')}</select></div>

${rows.map(r=>`<tr><td>${esc(r.i.venue.trim())}</td><td>${fdt(r.d)}</td><td>${esc(r.i.time||'')}</td><td>${ntx(r.i.name)}</td><td>${esc(r.i.sec)}</td><td>${lvCodes(r.i)}</td><td><button class="b g" title="ഈ തീയതി നീക്കുക" onclick="vRemoveDate('${r.i.id}','${r.d}')">✕ തീയതി</button> <button class="b g" title="സമയം മായ്ക്കുക" onclick="vClearTime('${r.i.id}')">✕ സമയം</button></td></tr>`).join('')||'<tr><td colspan="7"><i>ഇതുവരെ ഒരു ഇനവും വേദിയിൽ ചേർത്തിട്ടില്ല</i></td></tr>'}
</table></div>`;
};

// ===== Publish to the blog only when the admin asks =====
async function khPublish(){
  if(!KH){alert('ഓൺലൈൻ സേവ് ലഭ്യമല്ല. Web app URL പരിശോധിക്കുക.');return}
  if(!confirm('ഇപ്പോഴത്തെ വിവരങ്ങൾ ബ്ലോഗിൽ കാണിക്കണോ?'))return;
  if(khT){clearTimeout(khT);khT=0;khPush()}
  khQ=khQ.then(async()=>{try{await khPubWrite();setSync('✓ ബ്ലോഗിൽ പ്രസിദ്ധീകരിച്ചു '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}catch(e){const m=friendlyErr(e);setSync('⚠ പ്രസിദ്ധീകരിക്കാനായില്ല: '+m);alert('പ്രസിദ്ധീകരിക്കാനായില്ല\n'+m)}});
}
async function khHide(){
  if(!KH)return;
  if(!confirm('ബ്ലോഗിൽ നിന്ന് വിവരങ്ങൾ മറയ്ക്കണോ?'))return;
  khQ=khQ.then(async()=>{try{await KH.doc('pub/meta').set({n:0,v:String(Date.now()),hidden:true});await KH.doc('pub/live').set({d:JSON.stringify({hidden:true})});setSync('ബ്ലോഗിൽ നിന്ന് മറച്ചു')}catch(e){const m=friendlyErr(e);setSync('⚠ മറയ്ക്കാനായില്ല: '+m);alert('മറയ്ക്കാനായില്ല\n'+m)}});
}

// ===== Live document for the blog: venues, today's items with performer code lists, and what is running now =====
function liveBuild(){
  const d=tod();
  return{at:new Date().toISOString(),date:d,venues:lvVenues().map(v=>{
    const its=lvItemsAt(v,d).map(i=>{
      const r=lvR(i,d);
      const list=parts(i).map(p=>String(p.code||'')).filter(Boolean).sort((x,y)=>(+x)-(+y));
      return{id:i.id,name:i.name,sec:i.sec,codes:lvCodes(i),time:i.time||'',start:r.start||'',end:r.end||'',list,done:r.done||[],cur:r.cur||'',lots:Object.fromEntries(parts(i).filter(p=>p.code).map(p=>[String(p.code),S.lot[p.id]||''])) };
    });
    const cur=its.find(x=>x.start&&!x.end);
    return{name:v,no:(S.vnum||{})[v]||'',now:cur?{name:cur.name,sec:cur.sec,codes:cur.codes,start:cur.start,code:cur.cur}:null,items:its};
  })};
}
// Venue staff write 'pub/run/<venue no>/<item>|<date>' (start, end, done codes). Pull those into the admin data.
async function mergeRuns(){
  try{
    const all=await gsAll();
    Object.keys(all).forEach(k=>{
      if(k.indexOf('pub/run/')!==0)return;
      const rest=k.slice(8),j=rest.indexOf('/');if(j<0)return;
      const key=rest.slice(j+1),r=all[k]||{};
      S.ev[key]={start:r.start||'',end:r.end||'',done:r.done||[],cur:r.cur||''};
    });
  }catch(e){}
}

// Turn a save/publish error into a clear message for the admin
function friendlyErr(e){
  const m=String((e&&e.message)||e||'');
  if(m==='denied')return 'അഡ്മിൻ PIN തെറ്റിയിരിക്കുന്നു. പേജ് റീലോഡ് ചെയ്ത് ശരിയായ PIN നൽകുക.';
  if(m==='read-only')return 'PIN നൽകിയിട്ടില്ല. പേജ് റീലോഡ് ചെയ്ത് PIN നൽകുക.';
  if(m==='bad request')return 'Apps Script ഡാറ്റ സ്വീകരിച്ചില്ല. Apps Script കോഡ് പുതുക്കിയിട്ടുണ്ടോ എന്ന് നോക്കുക.';
  if(/Failed to fetch|NetworkError|fetch/i.test(m))return 'ഇന്റർനെറ്റ് അല്ലെങ്കിൽ Web app URL പ്രശ്നം. GS_URL ശരിയാണോ എന്ന് പരിശോധിക്കുക.';
  if(/PASTE_WEB_APP_URL|http/i.test(m)&&!/https:\/\/script\.google\.com/.test(String(GS_URL||'')))return 'Web app URL നൽകിയിട്ടില്ല (GS_URL).';
  return m||'അജ്ഞാത പിശക്';
}
